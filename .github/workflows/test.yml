name: Quality checks

on:
  push:
    branches: [dev, testing, main, 'codex/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Do not interrupt a deployment already in progress on testing or main.
concurrency:
  group: pipeline-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.ref != 'refs/heads/main' && github.ref != 'refs/heads/testing') }}

jobs:
  test:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: restaurant_test
          POSTGRES_USER: qa
          POSTGRES_PASSWORD: qa_test_only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U qa -d restaurant_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run test:integration
        env:
          TEST_DATABASE_URL: postgresql://qa:qa_test_only@localhost:5432/restaurant_test
          TEST_DATABASE_SSL: 'false'
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build deployment image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: jaj-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test deployment image
        run: bash scripts/ci/container-smoke.sh
      - name: Export verified image
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/testing' || github.ref == 'refs/heads/main')
        run: docker save jaj-api:ci -o "$RUNNER_TEMP/image.tar"
      - name: Save verified image for deployment
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/testing' || github.ref == 'refs/heads/main')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: deployment-image-${{ github.sha }}
          overwrite: true
          path: ${{ runner.temp }}/image.tar
          retention-days: 3
          compression-level: 0
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: coverage
          overwrite: true
          path: coverage/
          retention-days: 14

  deploy-testing:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/testing' && vars.AZURE_DEPLOY_TESTING == 'true'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/deploy.yml
    with:
      environment: testing

  deploy-production:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.AZURE_DEPLOY_PRODUCTION == 'true'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/deploy.yml
    with:
      environment: production

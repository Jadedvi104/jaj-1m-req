name: Quality checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: restaurant_test
          POSTGRES_USER: qa
          POSTGRES_PASSWORD: qa_test_only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U qa -d restaurant_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run test:integration
        env:
          TEST_DATABASE_URL: postgresql://qa:qa_test_only@localhost:5432/restaurant_test
          TEST_DATABASE_SSL: 'false'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/

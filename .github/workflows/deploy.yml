name: Deploy to Azure

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    # Defense in depth: never deploy PR code or arbitrary branches.
    if: >-
      github.event_name != 'pull_request' &&
      ((inputs.environment == 'testing' && github.ref == 'refs/heads/testing') ||
       (inputs.environment == 'production' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: ${{ inputs.environment }}
      url: ${{ steps.deploy.outputs.url }}
    concurrency:
      group: azure-deploy-${{ inputs.environment }}
      cancel-in-progress: false
    env:
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      AZURE_ACR_NAME: ${{ vars.AZURE_ACR_NAME }}
      AZURE_CONTAINER_APP: ${{ vars.AZURE_CONTAINER_APP }}
      AZURE_CONTAINER_NAME: ${{ vars.AZURE_CONTAINER_NAME }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Check deployment configuration
        shell: bash
        run: |
          for key in AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID AZURE_RESOURCE_GROUP AZURE_ACR_NAME AZURE_CONTAINER_APP AZURE_CONTAINER_NAME; do
            if [[ -z "${!key}" ]]; then
              echo "::error::Missing environment variable: $key. See CI_CD.md."
              exit 1
            fi
          done
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: deployment-image-${{ github.sha }}
          path: ${{ runner.temp }}/deployment-image
      - uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Publish image and verify Azure revision
        id: deploy
        run: bash scripts/ci/deploy-azure.sh
